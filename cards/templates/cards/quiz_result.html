{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="alert alert-success">
        <h4>Результат викторины</h4>
        <p>Вы правильно ответили на {{ score }} из {{ total }} вопросов</p>
        <p>Процент правильных ответов: {{ percentage|floatformat:0 }}%</p>
    </div>
    <a href="{% url 'quiz' lesson_id=lesson_id %}" class="btn btn-primary">Попробовать снова</a>
    <a href="{% url 'home' %}" class="btn btn-secondary">На главную</a>
</div>
{% endblock %}
