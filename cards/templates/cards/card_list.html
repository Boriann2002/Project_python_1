{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Все карточки</h2>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Слово</th>
            <th>Перевод</th>
            <th>Урок</th>
            <th>Изображение</th>
        </tr>
    </thead>
    <tbody>
        {% for card in cards %}
        <tr>
            <td>{{ card.word }}</td>
            <td>{{ card.translation }}</td>
            <td>{{ card.lesson.title }}</td>
            <td>
                {% if card.image %}
                <img src="{{ card.image.url }}" width="50" class="img-thumbnail">
                {% else %}
                —
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a href="{% url 'add_card' %}" class="btn btn-primary mt-3">
    + Добавить карточку
</a>
{% endblock %}
